<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учители и администратори</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    <?!= includeEssentialHtmlStyles() ?>
  </style>
</head>
<body>
  <?!= navigation(url) ?>
  <div class="offcanvas offcanvas-end visible" tabindex="-1" data-bs-backdrop="false" id="notifications-list"
        style="z-index: 1051;">
        <div class="offcanvas-header"><span class="fs-4">Известия</span><button class="btn-close"
                id="close-notifications" type="button" aria-label="Close" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body d-flex flex-column justify-content-between p-0">
            <div>
                <hr class="my-0">
                <div class="list-group list-group-flush border-bottom scrollarea">
                    <ul id="notifications-group" class="list-group-item list-group-item-action py-3 lh-tight"
                        aria-current="true">
                    </ul>
                </div>
            </div>
        </div>
    </div>
  <main style="margin-top: 2rem;" class="container">
  <h2>Администратори</h2>
  <table class="table table-bordered">
    <thead><tr><th>Имена</th><th>Имейл</th><th>Телефон</th><th>Длъжност</th><th></th></tr></thead>
    <tbody id="adminTableBody"></tbody>
  </table>

  <h2 class="mt-5">Учители</h2>
  <table class="table table-bordered">
    <thead><tr><th>Имена</th><th>Имейл</th><th>Телефон</th><th>Длъжност</th><th></th></tr></thead>
    <tbody id="teacherTableBody"></tbody>
  </table>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      google.script.run.withSuccessHandler(renderUsers).getAllUsers();
    });

    function renderUsers(users) {
      const admins = document.getElementById('adminTableBody');
      const teachers = document.getElementById('teacherTableBody');
      admins.innerHTML = '';
      teachers.innerHTML = '';

      users.forEach(user => {
        const collapseId = `collapse-${user._id}`;
        const rowHtml = `
          <tr>
            <td>${user._names}</td>
            <td>${user._email}</td>
            <td>${user._phone}</td>
            <td>${user._position}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#${collapseId}">Разписание</button>
            </td>
          </tr>
          <tr class="collapse collapse-row" id="${collapseId}">
            <td colspan="5">${renderTimetable(user._timetable)}</td>
          </tr>
        `;
        if (user._role === 'admin') {
          admins.innerHTML += rowHtml;
        } else {
          teachers.innerHTML += rowHtml;
        }
      });
    }

    function renderTimetable(timetable) {
      try {
        if (typeof timetable === 'string') timetable = JSON.parse(timetable);
      } catch (e) {
        return '<em>Невалидно разписание</em>';
      }
      if (!Array.isArray(timetable) || timetable.length === 0) return '<em>Няма разписание</em>';

      const days = ['monday','tuesday','wednesday','thursday','friday'];
      const dayNames = {
        monday: 'Понеделник', tuesday: 'Вторник', wednesday: 'Сряда',
        thursday: 'Четвъртък', friday: 'Петък'
      };
      const grouped = { first: [], second: [] };
      timetable.forEach(e => grouped[e.shift].push(e));
      const maxHours = Math.max(...timetable.map(e => parseInt(e.time)));

      function tableHTML(shift) {
        const data = grouped[shift];
        let html = `<table class="table table-sm table-bordered mt-2"><thead><tr><th>Час</th>`;
        days.forEach(d => html += `<th>${dayNames[d]}</th>`);
        html += '</tr></thead><tbody>';
        for (let h = 1; h <= maxHours; h++) {
          html += `<tr><td>${h}</td>`;
          days.forEach(d => {
            const cell = data.find(e => e.day === d && parseInt(e.time) === h);
            html += `<td>${cell ? `${cell.group} - ${cell.room}` : ''}</td>`;
          });
          html += '</tr>';
        }
        html += '</tbody></table>';
        return html;
      }

      if (!grouped.second.length) return tableHTML('first');

      return `
        <ul class="nav nav-tabs">
          <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#first">Първа смяна</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#second">Втора смяна</a></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="first">${tableHTML('first')}</div>
          <div class="tab-pane fade" id="second">${tableHTML('second')}</div>
        </div>
      `;
    }
  </script>
  <script>
    <?!= includeEssentialHtmlScripts() ?>
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
