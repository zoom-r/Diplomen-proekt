<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учители и администратори</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.6.3/css/ionicons.min.css">
  <style>
    <?!= includeEssentialHtmlStyles() ?>
  </style>
</head>

<body>
  <?!= navigation(url) ?>
  <div class="offcanvas offcanvas-end visible" tabindex="-1" data-bs-backdrop="false" id="notifications-list"
    style="z-index: 1051;">
    <div class="offcanvas-header"><span class="fs-4">Известия</span><button class="btn-close" id="close-notifications"
        type="button" aria-label="Close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body d-flex flex-column justify-content-between p-0">
      <div>
        <hr class="my-0">
        <div class="list-group list-group-flush border-bottom scrollarea">
          <ul id="notifications-group" class="list-group-item list-group-item-action py-3 lh-tight" aria-current="true">
          </ul>
        </div>
      </div>
    </div>
  </div>
  <main class="container-fluid mt-4">
    <div class="row align-items-center mb-3">
      <div class="col-12 col-md-6">
        <h2>Потребители</h2>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <h4>Администратори</h4>
        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead>
              <tr>
                <th>Имена</th>
                <th>Имейл</th>
                <th>Телефон</th>
                <th>Длъжност</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>

        <h4 class="mt-5">Учители</h4>
        <div class="table-responsive">
          <table class="table table-bordered table-hover">
            <thead>
              <tr>
                <th>Имена</th>
                <th>Имейл</th>
                <th>Телефон</th>
                <th>Длъжност</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="teacherTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script>
    // Изпълнява се при зареждане на страницата и извиква функцията за зареждане на потребители
    document.addEventListener('DOMContentLoaded', () => {
      google.script.run.withSuccessHandler(renderUsers).getAllUsers();
    });

    /**
     * Рендира списъка с потребители (администратори и учители) в таблиците.
     * @param {Array} users - Масив с обекти, представляващи потребителите.
     */
    function renderUsers(users) {
      const admins = document.getElementById('adminTableBody'); // Таблицата за администратори
      const teachers = document.getElementById('teacherTableBody'); // Таблицата за учители
      admins.innerHTML = '';
      teachers.innerHTML = '';

      // Обхожда всеки потребител и добавя ред в съответната таблица
      users.forEach(user => {
        const collapseId = `collapse-${user.id}`; // Уникален ID за реда с разписанието
        const rowHtml = `
          <tr>
            <td>${user.names}</td>
            <td>${user.email}</td>
            <td>${user.phone}</td>
            <td>${user.position}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#${collapseId}">Разписание</button>
            </td>
          </tr>
          <tr class="collapse collapse-row" id="${collapseId}">
            <td colspan="5">${renderTimetable(user.timetable, user.id)}</td>
          </tr>
        `;
        // Добавя реда в таблицата за администратори или учители в зависимост от ролята
        if (user.role === 'admin') {
          admins.innerHTML += rowHtml;
        } else {
          teachers.innerHTML += rowHtml;
        }
      });
    }

    /**
     * Рендира разписанието на даден потребител.
     * @param {Array|string} timetable - Разписанието на потребителя (JSON или масив).
     * @returns {string} - HTML за визуализация на разписанието.
     */
    function renderTimetable(timetable, id) {
      try {
        // Ако разписанието е подадено като JSON низ, го парсваме
        if (typeof timetable === 'string') timetable = JSON.parse(timetable);
      } catch (e) {
        return '<em>Невалидно разписание</em>'; // Връща съобщение за грешка при невалидно разписание
      }
      if (!Array.isArray(timetable) || timetable.length === 0) return '<em>Няма разписание</em>'; // Ако няма разписание

      const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday']; // Дни от седмицата
      const dayNames = {
        monday: 'Понеделник', tuesday: 'Вторник', wednesday: 'Сряда',
        thursday: 'Четвъртък', friday: 'Петък'
      };
      const grouped = { first: [], second: [] }; // Групиране на разписанието по смени
      timetable.forEach(e => grouped[e.shift].push(e)); // Разделяне на записи по смяна
      const maxHours = Math.max(...timetable.map(e => parseInt(e.time))); // Определяне на максималния брой часове

      /**
       * Генерира HTML таблица за дадена смяна.
       * @param {string} shift - Смяната ('first' или 'second').
       * @returns {string} - HTML таблица за разписанието.
       */
      function tableHTML(shift) {
        const data = grouped[shift]; // Данни за съответната смяна
        let html = `<table class="table table-sm table-bordered mt-2"><thead><tr><th>Час</th>`;
        days.forEach(d => html += `<th>${dayNames[d]}</th>`); // Заглавия на колоните за дните
        html += '</tr></thead><tbody>';
        for (let h = 1; h <= maxHours; h++) { // Генериране на редове за часовете
          html += `<tr><td>${h}</td>`;
          days.forEach(d => {
            const cell = data.find(e => e.day === d && parseInt(e.time) === h); // Намиране на съответния запис
            html += `<td>${cell ? `${cell.group} - ${cell.room}` : ''}</td>`; // Попълване на клетката
          });
          html += '</tr>';
        }
        html += '</tbody></table>';
        return html;
      }

      // Ако има само една смяна, връща таблицата за първата смяна
      if (!grouped.second.length) return tableHTML('first');

      // Ако има две смени, връща табове с таблици за двете смени
      return `
        <ul class="nav nav-tabs">
          <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#first-${id}">Първа смяна</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#second-${id}">Втора смяна</a></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="first-${id}">${tableHTML('first')}</div>
          <div class="tab-pane fade" id="second-${id}">${tableHTML('second')}</div>
        </div>
      `;
    }
  </script>
  <script>
    <?!= includeEssentialHtmlScripts() ?>
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
