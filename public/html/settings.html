    <div class="offcanvas offcanvas-end visible" tabindex="-1" data-bs-backdrop="false" id="notifications-list" style="z-index: 1051;">
        <div class="offcanvas-header"><span class="fs-4">Известия</span><button class="btn-close" id="close-notifications"
                type="button" aria-label="Close" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body d-flex flex-column justify-content-between p-0">
            <div>
                    <hr class="my-0">
                    <div class="list-group list-group-flush border-bottom scrollarea">
                            <ul id="notifications-group" class="list-group-item list-group-item-action py-3 lh-tight" aria-current="true">
                            </ul>
                    </div>
            </div>
        </div>
    </div>
    <main class="container-fluid px-3 px-sm-5 py-4">
        <h1 class="mb-4 text-center">Настройки</h1>
        <form>
          <!-- Ред за смени и брой часове -->
          <div class="row g-3 mb-4">
            <div class="col-12 col-md-6">
              <label class="form-label d-block">Смени:</label>
              <div class="form-check form-check-inline">
                <input id="shiftCheck-first" name="shift" class="form-check-input" type="radio" value="first">
                <label class="form-check-label" for="shiftCheck-first">Една</label>
              </div>
              <div class="form-check form-check-inline">
                <input id="shiftCheck-second" name="shift" class="form-check-input" type="radio" value="second">
                <label class="form-check-label" for="shiftCheck-second">Две</label>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <label for="time-count" class="form-label">Максимален брой часове:</label>
              <input id="time-count" class="form-control" type="number" max="20" min="1" name="time-count">
            </div>
          </div>
      
          <!-- Шаблони за декларации -->
          <div class="mb-5">
            <label class="form-label">Добавяне на шаблон за декларация:</label>
            <div class="row gx-2 gy-2 align-items-center">
              <div class="col-12 col-sm">
                <input id="declaration-input" type="text" class="form-control" placeholder="Линк към Google Docs">
              </div>
              <div class="col-12 col-sm-auto">
                <button class="btn btn-outline-secondary w-100" type="button" onclick="addDeclarationTemplate()">+</button>
              </div>
            </div>
            <div id="declarations-list" class="mt-3"></div>
          </div>
      
          <div class="row gy-4">
            <div class="col-12 col-md-6">
              <h4 class="text-center text-md-start">Класове</h4>
              <div class="input-group mb-2">
                <input name="class-name" class="form-control" type="text">
                <button class="btn btn-success" type="button" onclick="addListItem(document.getElementsByName('class-name')[0])">
                  <i class="fa fa-plus"></i>
                </button>
              </div>
              <ol id="class-list" class="list-group"></ol>
            </div>
      
            <div class="col-12 col-md-6">
              <h4 class="text-center text-md-start">Стаи</h4>
              <div class="input-group mb-2">
                <input name="room-name" class="form-control" type="text">
                <button class="btn btn-success" type="button" onclick="addListItem(document.getElementsByName('room-name')[0])">
                  <i class="fa fa-plus"></i>
                </button>
              </div>
              <ol id="rooms-list" class="list-group"></ol>
            </div>
          </div>
        </form>
      </main>
