    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <script>
        <?!= includeEssentialHtmlScripts() ?>
    </script>
    <script>
        function loadRoomSchedule() {
    google.script.run.withSuccessHandler(renderRoomSchedule).getRoomUsageGrid();
  }
  
  function renderRoomSchedule(data) {
  const { grid, settings } = data;
  const container = document.getElementById("room-schedule-container");
  container.innerHTML = "";

  const days = ["monday", "tuesday", "wednesday", "thursday", "friday"];
  const dayNames = {
    monday: "Понеделник",
    tuesday: "Вторник",
    wednesday: "Сряда",
    thursday: "Четвъртък",
    friday: "Петък"
  };

  const tabsNav = document.createElement("ul");
  tabsNav.className = "nav nav-tabs mb-3";
  tabsNav.role = "tablist";

  const tabsContent = document.createElement("div");
  tabsContent.className = "tab-content";

  days.forEach((day, i) => {
    const tabId = `room-tab-${day}`;

    // Outer tab button (day)
    const tabButton = document.createElement("li");
    tabButton.className = "nav-item";
    tabButton.innerHTML = `
      <button class="nav-link ${i === 0 ? "active" : ""}" data-bs-toggle="tab"
        data-bs-target="#${tabId}" type="button" role="tab">
        ${dayNames[day]}
      </button>`;
    tabsNav.appendChild(tabButton);

    // Outer tab pane (day)
    const tabPane = document.createElement("div");
    tabPane.className = `tab-pane fade ${i === 0 ? "show active" : ""}`;
    tabPane.id = tabId;
    tabPane.role = "tabpanel";

    // Inner nav tabs for shifts
    const shiftTabs = document.createElement("ul");
    shiftTabs.className = "nav nav-pills mb-3";
    shiftTabs.role = "tablist";

    const shiftContent = document.createElement("div");
    shiftContent.className = "tab-content";

    const shifts = settings._shift === "second" ? ["first", "second"] : ["first"];
    shifts.forEach((shift, j) => {
      const shiftId = `${tabId}-${shift}`;

      // Shift tab button
      const shiftTabBtn = document.createElement("li");
      shiftTabBtn.className = "nav-item";
      shiftTabBtn.innerHTML = `
        <button class="nav-link ${j === 0 ? "active" : ""}" data-bs-toggle="tab"
          data-bs-target="#${shiftId}" type="button" role="tab">
          ${shift === "first" ? "Първа смяна" : "Втора смяна"}
        </button>`;
      shiftTabs.appendChild(shiftTabBtn);

      // Shift tab pane
      const shiftPane = document.createElement("div");
      shiftPane.className = `tab-pane fade ${j === 0 ? "show active" : ""}`;
      shiftPane.id = shiftId;
      shiftPane.role = "tabpanel";

      // Table
      const table = document.createElement("table");
      table.className = "table table-bordered bg-white";
      const thead = document.createElement("thead");
      thead.innerHTML = "<tr><th>Стая</th><th>Час</th><th>Клас</th></tr>";
      table.appendChild(thead);
      const tbody = document.createElement("tbody");

      const shiftData = grid[day][shift] || {};
      Object.keys(shiftData).forEach(room => {
        const entries = shiftData[room];
        const sorted = [...entries].sort((a, b) => Number(a.time) - Number(b.time));
        if (sorted.length === 0) return;

        sorted.forEach((entry, index) => {
          const row = document.createElement("tr");
          if (index === 0) {
            const roomCell = document.createElement("td");
            roomCell.textContent = room;
            roomCell.rowSpan = sorted.length;
            row.appendChild(roomCell);
          }
          const timeCell = document.createElement("td");
          timeCell.textContent = entry.time;
          row.appendChild(timeCell);

          const groupCell = document.createElement("td");
          groupCell.textContent = entry.group || "";
          row.appendChild(groupCell);

          tbody.appendChild(row);
        });
      });

      table.appendChild(tbody);
      shiftPane.appendChild(table);
      shiftContent.appendChild(shiftPane);
    });

    tabPane.appendChild(shiftTabs);
    tabPane.appendChild(shiftContent);
    tabsContent.appendChild(tabPane);
  });

  container.appendChild(tabsNav);
  container.appendChild(tabsContent);
}
  </script>
</body>

</html>
