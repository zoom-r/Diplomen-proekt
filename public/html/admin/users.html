    <div id="alert-wrapper" class="mt-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <script>
        let cachedSettings = null;
        let cachedUsedSlots = null;

        /* -------------------- FORM → OBJECT -------------------- */
        /**
         * Събира данните от формата за добавяне на потребител и ги връща като обект.
         * @returns {Object} userObj - Обект с данните на потребителя.
         */
        function collectForm() {
            const f = document.getElementById('addUserForm');

            const userObj = {
                names: `${f.firstName.value.trim()} ${f.middleName.value.trim()} ${f.lastName.value.trim()}`,
                email: f.email.value.trim(),
                phone: f.phone.value.trim(),
                role: f.querySelector('input[name="role"]:checked')?.value || 'teacher',
                position: f.position.value.trim(),
                timetable: document.getElementById('scheduleYes').checked
                    ? buildTimetableJSON()
                    : [] // без разписание
            };
            return userObj;
        }

        /**
         * Създава JSON обект за седмичното разписание на потребителя.
         * @returns {Array} entries - Масив с обекти, представляващи разписанието.
         */
        function buildTimetableJSON() {
            const selects = document.querySelectorAll('#scheduleTables select.class-dropdown');
            const entries = [];

            selects.forEach(sel => {
                const [day, hour, shift] = sel.dataset.info.split('-');
                const group = sel.value;

                const roomSel = document.getElementById(`room-dropdown-${day}-${hour}-${shift}`);
                const roomVal = roomSel?.value || '';

                // Проверяваме дали и клас, и стая са избрани
                if (group && roomVal && group !== '' && roomVal !== '') {
                    entries.push({
                        day,
                        time: hour,
                        shift,
                        group,
                        room: roomVal
                    });
                }
            });

            if (!entries.length) return [];
            return entries;
        }

        /* ------- Bootstrap alerts helpers ------- */
        /**
         * Показва съобщение за успех.
         * @param {string} msg - Съобщението за показване.
         */
        function alertSuccess(msg) { showAlert('success', msg); }

        /**
         * Показва съобщение за грешка.
         * @param {string} msg - Съобщението за показване.
         */
        function alertError(msg) { showAlert('danger', msg); }

        /**
         * Показва Bootstrap alert с даден тип и съобщение.
         * @param {string} type - Типът на съобщението ('success', 'danger' и т.н.).
         * @param {string} msg - Съобщението за показване.
         */
        function showAlert(type, msg) {
            const wrap = document.getElementById('alert-wrapper');
            wrap.innerHTML =
                `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${msg}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }

        /* ------- CRUD ------- */
        /**
         * Зарежда списъка с потребители от сървъра и го визуализира.
         */
        function loadUsers() {
            google.script.run
                .withSuccessHandler(renderTable)
                .withFailureHandler(alertError)
                .getAllUsers();
        }

        /**
         * Добавя нов потребител, като изпраща данните към сървъра.
         * @param {Event} event - Събитието от изпращането на формата.
         */
        function addUser(event) {
            event.preventDefault(); // предотвратяване на стандартното поведение на формата
            const userObj = collectForm(); // събери полетата от формата
            google.script.run
                .withFailureHandler(alertError)
                .withSuccessHandler((success) => {
                    if(success) {
                        alertSuccess('Потребителят е добавен успешно.');
                    } else {
                        alertError('Потребителят не е добавен. Възникнала е грешка.');
                    }
                    resetFormAndHideModal();
                    loadUsers();
                    reloadScheduleTables(); // презареждаме таблицата за създаване
                }).createUser(userObj);
        }

        /**
         * Изтрива потребител след потвърждение от потребителя.
         * @param {string} id - ID на потребителя за изтриване.
         */
        function delUser(id) {
            if (!confirm('Изтриване?')) return;
            google.script.run
                .withSuccessHandler(() => {
                    alertSuccess('Изтрит!');
                    loadUsers();
                    reloadScheduleTables(); // обновяване на свободните места
                })
                .withFailureHandler(alertError)
                .deleteUser(id);
        }

        /* ------- render ------- */
        /**
         * Рендира таблицата с потребители (администратори и учители).
         * @param {Array} list - Списък с потребители.
         */
        function renderTable(list) {
            const adminBody = document.getElementById('adminTableBody');
            const teacherBody = document.getElementById('teacherTableBody');

            adminBody.innerHTML = '';
            teacherBody.innerHTML = '';

            list.forEach(user => {
                const rowId = `user-${user.id}`;
                const collapseId = `collapse-${user.id}`;

                const rowHtml = `
                    <tr>
                    <td>${user.names}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>${user.position}</td>
                    <td>
                    <button class="btn btn-sm btn-outline-primary"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapse-${user.id}"
                    aria-expanded="false"
                    aria-controls="collapse-${user.id}">
                    Разписание
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="delUser('${user.id}')">🗑️</button>
                    </td>
                    </tr>
                    <tr class="collapse" id="collapse-${user.id}">
                    <td colspan="5" style="background-color:#f9f9f9;">
                    ${renderTimetable(user.timetable, user.id)}
                    </td>
                    </tr>
                `;

                if (user.role === 'admin') {
                    adminBody.innerHTML += rowHtml;
                } else {
                    teacherBody.innerHTML += rowHtml;
                }
            });
        }

        /**
         * Рендира разписанието на даден потребител.
         * @param {Array|string} table - Разписанието на потребителя.
         * @returns {string} - HTML за визуализация на разписанието.
         */
        function renderTimetable(table, id) {
            try {
                if (typeof table === 'string') table = JSON.parse(table);
            } catch (e) {
                console.warn('Invalid timetable:', table);
                return '<em>Невалидно разписание</em>';
            }

            if (!Array.isArray(table) || table.length === 0) {
                return '<em>Няма разписание</em>';
            }

            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'];
            const dayNames = {
                monday: 'Понеделник',
                tuesday: 'Вторник',
                wednesday: 'Сряда',
                thursday: 'Четвъртък',
                friday: 'Петък'
            };

            // Разделяме записите по смяна
            const grouped = {
                first: [],
                second: []
            };
            table.forEach(entry => {
                grouped[entry.shift].push(entry);
            });

            // Макс брой часове – взимаме най-голямо срещнато число
            const maxHours = Math.max(...table.map(e => parseInt(e.time)));

            // Генерираме таблица за дадена смяна
            function generateScheduleTable(shift) {
                const data = grouped[shift];
                let html = `<table class="table table-sm table-bordered"><thead><tr><th>Час</th>`;
                days.forEach(d => html += `<th>${dayNames[d]}</th>`);
                html += `</tr></thead><tbody>`;

                for (let hour = 1; hour <= maxHours; hour++) {
                    html += `<tr><td>${hour}</td>`;
                    days.forEach(day => {
                        const cell = data.find(e => e.day === day && parseInt(e.time) === hour);
                        if (cell) {
                            html += `<td>${cell.group} - ${cell.room}</td>`;
                        } else {
                            html += `<td></td>`;
                        }
                    });
                    html += `</tr>`;
                }
                html += `</tbody></table>`;
                return html;
            }

            // Ако има само една смяна
            if (!grouped.second.length) {
                return generateScheduleTable('first');
            }

            // Ако има две смени – табове
            return `
                <ul class="nav nav-tabs" id="shiftTabs" role="tablist">
                <li class="nav-item" role="presentation">
                <button class="nav-link active" id="first-tab" data-bs-toggle="tab" data-bs-target="#first-${id}" type="button" role="tab">Първа смяна</button>
                </li>
                <li class="nav-item" role="presentation">
                <button class="nav-link" id="second-tab" data-bs-toggle="tab" data-bs-target="#second-${id}" type="button" role="tab">Втора смяна</button>
                </li>
                </ul>
                <div class="tab-content mt-2">
                <div class="tab-pane fade show active" id="first-${id}" role="tabpanel">${generateScheduleTable('first')}</div>
                <div class="tab-pane fade" id="second-${id}" role="tabpanel">${generateScheduleTable('second')}</div>
                </div>
            `;
        }

        /**
         * Нулира формата за добавяне на потребител и затваря модала.
         */
        function resetFormAndHideModal() {
            const modal = bootstrap.Modal.getInstance(document.getElementById('addUserModal'));
            const form = document.getElementById('addUserForm');
            const scheduleTables = document.getElementById('scheduleTables');

            form.reset(); // изчиства всички полета
            scheduleTables.innerHTML = ''; // изчиства табличките
            scheduleTables.classList.add('d-none'); // скрива ги
            modal.hide(); // затваря модала
        }

        /**
         * Презарежда таблиците за разписание.
         */
        function reloadScheduleTables() {
            if (!cachedSettings || !cachedUsedSlots) return;
            generateScheduleTables(cachedSettings, cachedUsedSlots);
            addModalLogic(cachedSettings, cachedUsedSlots);
        }


        function generateScheduleTables(settings, usedSlots) {
            const scheduleTables = document.getElementById('scheduleTables');

            scheduleTables.innerHTML = ''; // Изчистване на предишното съдържание
            if (settings.shift === 'second') {
                const tabs = `
                    <ul class="nav nav-tabs" id="shiftTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="first-shift-tab" data-bs-toggle="tab" data-bs-target="#first-shift" type="button" role="tab">Първа смяна</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="second-shift-tab" data-bs-toggle="tab" data-bs-target="#second-shift" type="button" role="tab">Втора смяна</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="shiftTabsContent">
                        <div class="tab-pane fade show active" id="first-shift" role="tabpanel"></div>
                        <div class="tab-pane fade" id="second-shift" role="tabpanel"></div>
                    </div>
                `;
                scheduleTables.innerHTML = tabs;

                generateTable(document.getElementById('first-shift'), { ...settings, shift: 'first' }, usedSlots);
                generateTable(document.getElementById('second-shift'), { ...settings, shift: 'second' }, usedSlots);
            } else {
                generateTable(scheduleTables, settings, usedSlots);
            }
        }

        // Функция за генериране на таблица
        function generateTable(container, settings, usedSlots) {
            const table = document.createElement('table');
            table.className = 'table table-bordered text-center';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Час</th>
                        <th>Понеделник</th>
                        <th>Вторник</th>
                        <th>Сряда</th>
                        <th>Четвъртък</th>
                        <th>Петък</th>
                    </tr>
                </thead>
                <tbody>
                    ${generateRows(settings, usedSlots)}
                </tbody>
            `;
            container.appendChild(table);
        }

        // Функция за генериране на редове
        function generateRows(settings, usedSlots) {
            let rows = '';
            for (let i = 1; i <= settings.max_classes; i++) {
                rows += `
                    <tr>
                        <td>${i}</td>
                        ${generateCells({ ...settings, hour: i }, usedSlots)}
                    </tr>
                `;
            }
            return rows;
        }

        // Функция за генериране на клетки
        function generateCells(settings, usedSlots) {
            let cells = '';
            for (let i = 0; i < 5; i++) {
                const day = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'][i];
                const key = `${day}-${settings.hour}-${settings.shift}`;
                const used = usedSlots[key] || { groups: [], rooms: [] };

                const availableClasses = settings.classes.filter(cls => !used.groups.includes(cls));
                const availableRooms = settings.rooms.filter(r => !used.rooms.includes(r));
                // 5 дни в седмицата

                cells += `
                    <td>
                        <select id="class-dropdown-${day}-${settings.hour}-${settings.shift}" 
                                class="form-select mb-2 class-dropdown" 
                                data-info="${day}-${settings.hour}-${settings.shift}">
                            <option value="">Избери клас</option>
                    ${availableClasses.map(cls => `<option value="${cls}">${cls}</option>`).join('')}
                        </select>
                        <select id="room-dropdown-${day}-${settings.hour}-${settings.shift}" 
                                class="form-select room-dropdown" 
                                data-info="${day}-${settings.hour}-${settings.shift}">
                            <option value="">Избери стая</option>
                    ${availableRooms.map(room => `<option value="${room}">${room}</option>`).join('')}
                        </select>
                    </td>
                `;
            }
            return cells;
        }

        function addModalLogic(settings, usedSlots) {
            const scheduleYes = document.getElementById('scheduleYes');
            const scheduleNo = document.getElementById('scheduleNo');
            const scheduleTables = document.getElementById('scheduleTables');

            // Проверка дали елементите съществуват
            if (scheduleYes && scheduleNo) {
                scheduleYes.addEventListener('change', function () {
                    if (this.checked) {
                        scheduleTables.classList.remove('d-none');
                        generateScheduleTables(settings, usedSlots);
                    }
                });

                scheduleNo.addEventListener('change', function () {
                    if (this.checked) {
                        scheduleTables.classList.add('d-none');
                        scheduleTables.innerHTML = ''; // Изчистване на таблиците
                    }
                });
            }
        }

        /* ------- init ------- */
        /**
         * Инициализира логиката за зареждане на потребители и настройки при зареждане на страницата.
         */
        document.addEventListener('DOMContentLoaded', function () {            
            google.script.run.withSuccessHandler(function (data) {
                cachedSettings = data.settings;
                cachedUsedSlots = data.usedSlots;
                loadUsers(); // Зареждане на потребителите
                addModalLogic(cachedSettings, cachedUsedSlots);
            }).getSettingsAndUsedSlots();
        });

        document.addEventListener('DOMContentLoaded', function () {
            // Добавяне на слушатели за промяна в dropdown менютата
            document.querySelectorAll('.class-dropdown, .room-dropdown').forEach(function (dropdown) {
                dropdown.addEventListener('change', function () {
                    const [day, hour, shift] = this.dataset.info.split('-');
                    updateDropdownOptions(day, hour, shift);
                });
            });
        });
    </script>
    <script>
        <?!= includeEssentialHtmlScripts() ?>
    </script>
</body>
