<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замествания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .table th,
        .table td {
            vertical-align: middle;
            text-align: center;
        }

        .absent-name {
            background-color: #f0f0f0;
            font-weight: bold;
            white-space: nowrap;
        }

    </style>
</head>

<body>
    <?!= navigation(url) ?>
    <div class="offcanvas offcanvas-end visible" tabindex="-1" data-bs-backdrop="false" id="notifications-list"
        style="z-index: 1051;">
        <div class="offcanvas-header"><span class="fs-4">Известия</span><button class="btn-close"
                id="close-notifications" type="button" aria-label="Close" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body d-flex flex-column justify-content-between p-0">
            <div>
                <hr class="my-0">
                <div class="list-group list-group-flush border-bottom scrollarea">
                    <ul id="notifications-group" class="list-group-item list-group-item-action py-3 lh-tight"
                        aria-current="true">
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Замествания</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAbsentModal">Добави
                отсъстващ</button>
        </div>

        <div id="dayTabs" class="mb-3"></div>
        <div id="dayContent" class="tab-content"></div>

        <!-- Модал за добавяне на отсъстващ -->
        <div class="modal fade" id="addAbsentModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Добави отсъстващ</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="absentForm">
                            <div class="mb-3">
                                <label for="userSelect" class="form-label">Потребител</label>
                                <select id="userSelect" class="form-select" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">От дата</label>
                                <input type="date" id="fromDate" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">До дата</label>
                                <input type="date" id="toDate" class="form-control" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Отказ</button>
                        <button class="btn btn-primary" onclick="submitAbsent()">Създай</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        // Глобални променливи за настройки и потребители с разписания
        let globalSettings = null;
        let globalUsersWithSchedule = [];
        let cachedWeekDates = null; // Кеширани дати за седмицата

        // Изпълнява се при зареждане на страницата
        document.addEventListener('DOMContentLoaded', () => {
            google.script.run.withSuccessHandler(function (data) {
                globalSettings = data.settings; // Зарежда глобалните настройки
                globalUsersWithSchedule = data.users; // Зарежда потребителите с разписания
                cachedWeekDates = data.weekDates; // Кешира дати за седмицата
                renderSubstitutionTabs(cachedWeekDates); // Рендира табовете за дните
                renderSubstitutionGrid(data.grid); // Рендира таблицата за замествания

                // Попълва select елемента в модала с потребители
                const select = document.getElementById('userSelect');
                data.users.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.id;
                    opt.textContent = `${u.names} (${u.role})`;
                    select.appendChild(opt);
                });
            }).getSubstitutePageDataForAdmin(); // Извлича данни за страницата
        });

        /**
         * Изпраща данни за нов отсъстващ потребител.
         */
        function submitAbsent() {
            const userId = document.getElementById('userSelect').value; // ID на потребителя
            const from = document.getElementById('fromDate').value; // Начална дата
            const to = document.getElementById('toDate').value; // Крайна дата

            // Проверка дали всички полета са попълнени
            if (!userId || !from || !to) return alert('Попълни всички полета.');

            // Изпраща данните към сървъра
            google.script.run.withSuccessHandler(() => {
                bootstrap.Modal.getInstance(document.getElementById('addAbsentModal')).hide(); // Затваря модала
                document.getElementById('absentForm').reset(); // Нулира формата
                google.script.run.withSuccessHandler(renderSubstitutionGrid).getSubstitutionGridForWeek(); // Обновява таблицата
            }).createAbsentSubstitution(userId, from, to);
        }

        /**
         * Изтрива всички отсъствия на даден потребител за седмицата.
         * @param {string} userId - ID на потребителя.
         */
        function deleteAbsentFromWeek(userId) {
            if (!confirm('Сигурен ли си, че искаш да изтриеш всички отсъствия на този учител за седмицата?')) return;

            // Изтрива отсъствията и обновява изгледа
            google.script.run.withSuccessHandler(() => {
                alert('Отсъствията бяха изтрити.');
                renderSubstitutionTabs(cachedWeekDates); // Обновява табовете
                google.script.run.withSuccessHandler(renderSubstitutionGrid).getSubstitutionGridForWeek(); // Обновява таблицата
            }).removeAbsentFromWeek(userId);
        }

        /**
         * Рендира табовете за дните от седмицата.
         * @param {Array} weekDates - Дати за текущата седмица.
         */
        function renderSubstitutionTabs(weekDates) {
            const days = ['Понеделник', 'Вторник', 'Сряда', 'Четвъртък', 'Петък']; // Имена на дните
            const dayTabs = document.getElementById('dayTabs'); // Контейнер за табовете
            const dayContent = document.getElementById('dayContent'); // Контейнер за съдържанието
            const hasTwoShifts = globalSettings._shift === 'second'; // Проверка за две смени

            let tabs = '<ul class="nav nav-pills mb-3" role="tablist">';
            let content = '';

            let todayIndex = new Date().getDay() - 1; // Индекс на текущия ден
            if (todayIndex < 0) todayIndex = 4; // Ако е неделя, задава петък

            for (let i = 0; i < 5; i++) {
                const id = `day-${i}`;
                const isActive = i === todayIndex; // Активен таб за текущия ден
                const date = new Date(weekDates[i]).toLocaleDateString('bg-BG'); // Форматирана дата

                // Създава таб за деня
                tabs += `<li class="nav-item">
                <button class="nav-link ${isActive ? 'active' : ''}" data-bs-toggle="tab" data-bs-target="#${id}" type="button" role="tab">
                    ${days[i]}<br><small>${date}</small>
                </button>
            </li>`;

                // Създава съдържание за деня
                let innerContent = '';
                if (hasTwoShifts) {
                    innerContent = `<ul class="nav nav-pills mt-3" id="${id}-shiftTabs" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#${id}-first" type="button">Първа смяна</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#${id}-second" type="button">Втора смяна</button></li>
                </ul>
                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="${id}-first">
                        <table class="table table-bordered"><thead><tr><th>Отсъстващ</th><th>Час</th><th>Клас</th><th>Стая</th><th>Заместващ</th></tr></thead><tbody id="${id}-first-body"></tbody></table>
                    </div>
                    <div class="tab-pane fade" id="${id}-second">
                        <table class="table table-bordered"><thead><tr><th>Отсъстващ</th><th>Час</th><th>Клас</th><th>Стая</th><th>Заместващ</th></tr></thead><tbody id="${id}-second-body"></tbody></table>
                    </div>
                </div>`;
                } else {
                    innerContent = `<table class="table table-bordered mt-3"><thead><tr><th>Отсъстващ</th><th>Час</th><th>Клас</th><th>Стая</th><th>Заместващ</th></tr></thead><tbody id="${id}-single-body"></tbody></table>`;
                }

                content += `<div class="tab-pane fade ${isActive ? 'show active' : ''}" id="${id}" role="tabpanel">${innerContent}</div>`;
            }

            tabs += '</ul>';
            dayTabs.innerHTML = tabs; // Добавя табовете в DOM
            dayContent.innerHTML = content; // Добавя съдържанието в DOM
        }

        /**
         * Рендира таблицата за замествания.
         * @param {Object} grid - Данни за заместванията.
         */
        function renderSubstitutionGrid(grid) {
            const hasTwoShifts = globalSettings._shift === 'second'; // Проверка за две смени

            for (const [day, entries] of Object.entries(grid)) {
                const index = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'].indexOf(day); // Индекс на деня
                if (index < 0) continue;

                const grouped = {}; // Групиране на записи по смяна и отсъстващ
                entries.filter(e => hasTwoShifts || e.shift === 'first').forEach(e => {
                    const shift = hasTwoShifts ? e.shift : 'single';
                    const key = `${shift}-${e.absentTeacher.id}`;
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(e);
                });

                // Рендира редовете за всяка група
                Object.entries(grouped).forEach(([key, list]) => {
                    const [shift] = key.split('-');
                    const tbody = document.getElementById(`day-${index}-${shift}-body`);
                    if (!tbody) return;

                    list.sort((a, b) => a.time - b.time); // Сортира по час
                    const rowspan = list.length;

                    list.forEach((e, i) => {
                        tbody.innerHTML += `<tr>
                        ${i === 0 ? `<td class="absent-name" rowspan="${rowspan}">${e.absentTeacher.name.split(' ').filter((_, i) => i !== 1).join(' ')} <button class="btn btn-sm btn-outline-danger" onclick="deleteAbsentFromWeek('${e.absentTeacher.id}')">🗑️</button></td>` : ''}
                        <td>${e.time}</td>
                        <td>${e.group}</td>
                        <td>${e.room}</td>
                        <td>${e.substitute ? e.substitute.name.split(' ').filter((_, i) => i !== 1).join(' ') : '<em>няма</em>'}</td>
                    </tr>`;
                    });
                });
            }
        }
    </script>
    <script>
        <?!= includeEssentialHtmlScripts() ?>
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
